<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Listing - Mugs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .card img {
      height: 200px;
      object-fit: cover;
    }
    .filter-section {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="container my-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Mugs</h2>
      <p class="text-muted">Choose from a variety of mugs and styles</p>
    </div>

    <!-- Dropdown Filter -->
    <div class="dropdown">
      <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
        Filter Category
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">All</a></li>
        <li><a class="dropdown-item" href="#">Ceramic</a></li>
        <li><a class="dropdown-item" href="#">Glass</a></li>
        <li><a class="dropdown-item" href="#">Printed</a></li>
      </ul>
    </div>
  </div>

  <div class="row">

    <!-- Sidebar Filters -->
    <div class="col-md-3 mb-4">
      <div class="filter-section">
        <h5>Target Market</h5>
        <div><input type="checkbox"> USA</div>
        <div><input type="checkbox"> India</div>
        <div><input type="checkbox"> Europe</div>

        <hr>

        <h5>Print Area</h5>
        <div><input type="checkbox"> Front</div>
        <div><input type="checkbox"> Full Wrap</div>

        <hr>

        <h5>Providers</h5>
        <div><input type="checkbox"> Printify</div>
        <div><input type="checkbox"> Local Vendor</div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="col-md-9">
      <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">Ceramic Mug</h6>
              <p class="text-muted">₹499</p>
              <button class="btn btn-primary w-100">Add to Cart</button>
            </div>
          </div>
        </div>

        <!-- Product 2 -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">Color Mug</h6>
              <p class="text-muted">₹599</p>
              <button class="btn btn-primary w-100">Add to Cart</button>
            </div>
          </div>
        </div>

        <!-- Product 3 -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">Black Mug</h6>
              <p class="text-muted">₹549</p>
              <button class="btn btn-primary w-100">Add to Cart</button>
            </div>
          </div>
        </div>

        <!-- Product 4 -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">Printed Mug</h6>
              <p class="text-muted">₹699</p>
              <button class="btn btn-primary w-100">Add to Cart</button>
            </div>
          </div>
        </div>

        <!-- Product 5 -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">White Mug</h6>
              <p class="text-muted">₹450</p>
              <button class="btn btn-primary w-100">Add to Cart</button>
            </div>
          </div>
        </div>

        <!-- Product 6 -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">Glass Mug</h6>
              <p class="text-muted">₹799</p>
              <button class="btn btn-primary w-100">Add to Cart</button>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
